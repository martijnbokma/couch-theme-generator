[build]
  command = "npx pnpm install --no-frozen-lockfile && npx pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--version" # Prevents npm from being used
  NETLIFY_USE_PNPM = "true"

[dev]
  command = "pnpm run dev"
  port = 5173
  targetPort = 5173

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
